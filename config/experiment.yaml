# ======================= Experiment configuration =======================
# June 2026 collection (the data analysed in the manuscript) used exactly the
# `api` and `generation` settings below, with ONE documented exception:
#   generation.max_tokens.rating was 12 during the first full pass; responses
#   that came back EMPTY were moved to data/raw_quarantine/ (tools/quarantine_empty.py)
#   and re-queried with max_tokens.rating = 40. Non-empty responses from the first
#   pass were kept. Run `python -m tools.diagnose_usage` to see, per model, how many
#   completions hit the 12- and 40-token budgets (data/raw/_usage.csv).
# NOTE: v1.0.0 listed `temperature_sweep: [0.0, 0.7, 1.0]` here, but no code ever
#   used it and no temperature sweep was run. The key has been removed.

api:
  base_url: "https://integrate.api.nvidia.com/v1"   # NVIDIA NIM (build.nvidia.com)
  env_key: "NVIDIA_API_KEY"        # read from the environment / .env; never commit keys
  rate_per_sec: 2
  concurrency: 3
  max_retries: 2
  use_seed: false

generation:
  temperature: 0.7
  repeats:                          # repetitions per prompt, by alignment stage label
    base: 8
    instruct: 8
    frontier: 5                     # legacy label = the heavily safety-tuned model (Nemotron-Mini-4B)
  max_tokens:
    rating: 40                      # see header note (first pass used 12)
    other: 256

measurement:
  enable_m1: true                   # free-text lexicon sentiment (VADER / cnsenti); exploratory only
  enable_m2: false
  m2_model_en: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  m2_model_zh: "uer/roberta-base-finetuned-jd-binary-chinese"
  enable_llm_judge: false
  comparative_attribution: true
  comparative_magnitude: 0.5
  rating_parser: strict             # strict (revision, primary) | legacy (as submitted in v1.0.0)
  truncation_heuristic:             # used only when finish_reason was not logged (June data)
    en_min_words: 6
    zh_min_chars: 12

analysis:
  # Models queried in June but excluded from all analyses (empty responses; see S1 File).
  exclude_models:
    - "openai/gpt-oss-20b"
    - "nvidia/llama-3.3-nemotron-super-49b-v1.5"
  # Explicit lineage map used for family-level (hierarchical) sensitivity analyses.
  families:
    "meta/llama-3.1-8b-instruct": "Llama"
    "meta/llama-3.3-70b-instruct": "Llama"
    "nvidia/nemotron-mini-4b-instruct": "Llama"
    "mistralai/mixtral-8x7b-instruct-v0.1": "Mistral"
    "qwen/qwen3-next-80b-a3b-instruct": "Qwen"
    "google/gemma-2-2b-it": "Gemma"
    "microsoft/phi-4-mini-instruct": "Phi"
    "openai/gpt-oss-20b": "GPT-OSS"
    "nvidia/llama-3.3-nemotron-super-49b-v1.5": "Llama"
  # Models with the highest rating-format missingness (sensitivity: drop them).
  high_missingness_models:
    - "mistralai/mixtral-8x7b-instruct-v0.1"
    - "nvidia/nemotron-mini-4b-instruct"
  # Pre-specified directions (copied from config/dimensions.yaml; used only for reporting).
  dimension_order: [productivity, decision, trust, reliability, moral, emotion, creativity, worth]

smoke:
  models: 1
  dimensions: ["reliability"]
  repeats: 2

paths:                              # relative to the data root (data/, or data_mock/ with --mock)
  prompts: "data/prompts/grid.jsonl"
  raw_dir: "data/raw"
  quarantine_dir: "data/raw_quarantine"
  measured: "data/measured/items.parquet"
  rating_responses: "data/measured/rating_responses.csv"
  freetext_responses: "data/measured/freetext_responses.csv"
  results_dir: "data/results"
  cost_log: "data/raw/_usage.csv"
