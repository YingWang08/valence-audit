# ============ 模型清单（基于 2026 实测 --full 跑满情况筛定）============
#
# 本文件只保留【实测能跑满】的模型，已删除所有 0 行 / 半成品的失效 ID
# （它们要么 ID 在当前 NIM key 上不存在，要么被网络限速反复打挂）。
# 跑满标准：instruct = 288 prompt × 8 重复 = 2304 行；frontier = 288 × 5 = 1440 行。
#
# stage 含义：
#   instruct = 标准指令微调模型（H1/H2/H4 主集）
#   frontier = 重度对齐强化模型（Nemotron 系），承载 H5 的“对齐强度梯度”对比
#   base     = 未对齐基座（H3 需要）——当前 NIM 上没有可用的，故无 base，H3 自动跳过
#
# ⚠️ 模型非独立性（写进 Methods/Limitations）：
#   - llama 家族占比偏高（llama-3.1-8b、llama-3.3-70b，且两个 frontier 的 Nemotron 也基于 Llama 基座）；
#   - 两个 frontier 都是 Nemotron 系、共享对齐配方 → H5 的 frontier vs instruct 对比中
#     “对齐强度”与“模型血缘”部分混淆，H5 一律用【关联】措辞，不写“对齐导致”。
#   - by_family.csv 会输出各家族均值，跨模型泛化结论需谨慎。

# ---- instruct 主集（7 个模型，6 个架构家族：llama / mistral / qwen / gemma / phi / openai-oss）----
- name: "meta/llama-3.1-8b-instruct"
  stage: instruct          # Llama 家族 · 小尺寸（适合先 smoke）
- name: "meta/llama-3.3-70b-instruct"
  stage: instruct          # Llama 家族 · 大、较新一代
- name: "mistralai/mixtral-8x7b-instruct-v0.1"
  stage: instruct          # Mistral 家族 · MoE
- name: "qwen/qwen3-next-80b-a3b-instruct"
  stage: instruct          # Qwen 家族
- name: "google/gemma-2-2b-it"
  stage: instruct          # Gemma 家族 · 小尺寸
- name: "microsoft/phi-4-mini-instruct"
  stage: instruct          # Phi 家族 · 小尺寸
#- name: "openai/gpt-oss-20b"
#  stage: instruct          # OpenAI 开放权重家族

